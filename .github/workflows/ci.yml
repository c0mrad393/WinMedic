name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Parse and lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The parse gate. Development happens on macOS where the script cannot be
      # run at all, so this is the first place a syntax error would surface.
      - name: Parse every PowerShell file
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1, *.psd1 |
              Where-Object { $_.FullName -notmatch '\\\.git\\' } |
              ForEach-Object {
                  $errors = $null
                  $tokens = $null
                  [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
                  if ($errors -and $errors.Count -gt 0) {
                      $failed = $true
                      Write-Host "::group::$($_.Name) - $($errors.Count) parse error(s)"
                      foreach ($e in $errors) {
                          Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                      }
                      Write-Host "::endgroup::"
                  }
                  else {
                      Write-Host "ok  $($_.Name)"
                  }
              }
          if ($failed) { throw "One or more files failed to parse." }

      # The main window is built from XAML held in here-strings. A malformed
      # attribute only shows up when the window is created at runtime, so parse
      # each block here instead.
      - name: Parse embedded XAML
        shell: pwsh
        run: |
          $src = Get-Content -Raw -Encoding UTF8 .\WMT-GUI.ps1
          $blocks = [regex]::Matches($src, '(?s)<Window\b.*?</Window>')
          Write-Host "Found $($blocks.Count) XAML window block(s)."
          $failed = 0
          foreach ($b in $blocks) {
              # Attribute values built from PowerShell variables are not XML yet.
              $t = [regex]::Replace($b.Value, '\$\(([^()]*)\)', 'X')
              $t = [regex]::Replace($t, '\$[A-Za-z_][A-Za-z0-9_:.]*', 'X')
              try { [xml]$t | Out-Null }
              catch {
                  $failed++
                  Write-Host "::warning::XAML block did not parse: $($_.Exception.Message)"
              }
          }
          # Block 0 is a dialog template whose attributes are assembled from
          # variables, so it never parses standalone. More than one failure is real.
          if ($failed -gt 1) { throw "$failed XAML blocks failed to parse." }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      # Gate 1: errors anywhere in the repo.
      - name: Lint - errors (whole repo)
        shell: pwsh
        run: |
          $r = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1 -Severity Error |
                     Where-Object { $_.Severity -eq 'Error' })
          if ($r) {
              $r | Format-Table -AutoSize | Out-String | Write-Host
              throw "$($r.Count) analyzer error(s)."
          }
          Write-Host "No analyzer errors."

      # Gate 2: warnings in code we wrote. New code is held to the higher bar.
      - name: Lint - warnings (Modules/)
        shell: pwsh
        run: |
          if (-not (Test-Path .\Modules)) { Write-Host "No Modules/ yet."; return }
          $r = @(Invoke-ScriptAnalyzer -Path .\Modules -Recurse -Settings .\PSScriptAnalyzerSettings.psd1 -Severity Error, Warning |
                     Where-Object { $_.Severity -in @('Error', 'Warning') })
          if ($r) {
              $r | Format-Table -AutoSize | Out-String | Write-Host
              throw "$($r.Count) analyzer finding(s) in Modules/."
          }
          Write-Host "Modules/ is clean."

      # Informational: the inherited monolith's debt, reported but not gating.
      - name: Lint - report (WMT-GUI.ps1)
        shell: pwsh
        continue-on-error: true
        run: |
          $r = Invoke-ScriptAnalyzer -Path .\WMT-GUI.ps1 -Settings .\PSScriptAnalyzerSettings.psd1
          Write-Host "Inherited findings: $($r.Count)"
          $r | Group-Object RuleName |
              Sort-Object Count -Descending |
              Select-Object -First 20 Count, Name |
              Format-Table -AutoSize | Out-String | Write-Host
